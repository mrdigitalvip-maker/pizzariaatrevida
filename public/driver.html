<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#10150f"><title>Minha rota · Atrevida</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/staff.css"><script type="module" src="/driver.js"></script><script type="module" src="/clock.js"></script></head><body class="admin-body"><header class="admin-header"><a class="admin-brand" href="/"><img src="/icon-192.png" alt="Atrevida"><span>ATREVIDA<small>MINHA ROTA</small></span></a><button onclick="installApp()">Instalar</button></header><main class="staff-main"><div data-clock class="clock-center"></div><span class="eyebrow">ÁREA DO ENTREGADOR</span><h1>Suas entregas, em ordem.</h1><p id="driver-message" role="status">Verificando seu acesso privado…</p><section id="driver-panel" hidden><div class="dashboard-stats" id="driver-stats"></div><details class="courier-profile"><summary>Meu perfil · personalizar e salvar</summary><div class="driver-avatar"><img id="driver-photo" hidden alt="Minha foto"><span id="driver-initial">A</span></div><form id="driver-form"><label>Meu nome<input name="name" required maxlength="60"></label><label>Moto / identificação<input name="vehicle" maxlength="60"></label><button class="primary">Salvar meu perfil</button></form><label>Minha foto<input id="photo-file" type="file" accept="image/*"></label></details><div class="app-actions"><button onclick="refreshDriver()">Atualizar entregas</button></div><p class="small muted">Atualização automática a cada 5 segundos enquanto esta tela estiver aberta. Mude o status somente quando a etapa acontecer.</p><div id="driver-orders"></div></section></main></body></html>
